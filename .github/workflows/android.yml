name: Build Flint APKs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older, still-running build pointless
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # lets the tag build attach APKs to a GitHub Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Once a Gradle wrapper is committed (see README), replace this step and the `gradle`
      # commands below with ./gradlew so local and CI builds use the same Gradle version.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.0

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > flint-release.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 secret not set. The APKs are signed with a throwaway debug key and can't update an installed release."
          fi

      # One APK per CPU architecture, plus a universal one (see `splits` in app/build.gradle.kts)
      - name: Build release APKs
        env:
          FLINT_KEYSTORE_FILE: flint-release.jks
          FLINT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLINT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLINT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Collect APKs
        id: collect
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -e
          mkdir -p dist
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          SUFFIX=""
          if [ "$SIGNED" != "true" ]; then SUFFIX="-DEBUG-SIGNED-do-not-distribute"; fi
          echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
          for apk in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$apk" .apk | sed -E 's/^app-//; s/-release(-unsigned)?$//')
            name="Flint-${VERSION}-${abi}${SUFFIX}.apk"
            cp "$apk" "dist/${name}"
            # A folder per architecture, so each one can be uploaded as its own download
            mkdir -p "by-abi/${abi}"
            cp "$apk" "by-abi/${abi}/${name}"
          done
          if [ -z "$(ls dist)" ]; then echo "::error::No APKs were produced"; exit 1; fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -l dist

      # One download per architecture (GitHub wraps every artifact in a zip, so a single upload
      # would put all APKs in one zip). Tagged releases below attach the plain .apk files.
      - uses: actions/upload-artifact@v4
        with:
          name: Flint-arm64-v8a${{ steps.collect.outputs.suffix }}
          path: by-abi/arm64-v8a/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Flint-armeabi-v7a${{ steps.collect.outputs.suffix }}
          path: by-abi/armeabi-v7a/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Flint-x86_64${{ steps.collect.outputs.suffix }}
          path: by-abi/x86_64/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Flint-x86${{ steps.collect.outputs.suffix }}
          path: by-abi/x86/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Flint-universal${{ steps.collect.outputs.suffix }}
          path: by-abi/universal/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Flint-checksums${{ steps.collect.outputs.suffix }}
          path: dist/SHA256SUMS.txt

      # Only a properly signed build is published. Push a tag like v1.0.1 to make a release.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
